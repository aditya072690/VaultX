version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vaultx-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vaultx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_vaultx_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-vaultx_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vaultx_user} -d ${POSTGRES_DB:-vaultx_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: vaultx-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5001
      DATABASE_URL: postgresql://${POSTGRES_USER:-vaultx_user}:${POSTGRES_PASSWORD:-secure_vaultx_password_2026}@postgres:5432/${POSTGRES_DB:-vaultx_prod}
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_at_least_32_chars_long}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your_super_secret_refresh_jwt_key_at_least_32_chars_long}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      STORAGE_MODE: ${STORAGE_MODE:-local}
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads

volumes:
  postgres_data:
  backend_uploads:
