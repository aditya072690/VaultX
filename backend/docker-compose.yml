version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vaultx_postgres
    environment:
      POSTGRES_USER: vaultx_user
      POSTGRES_PASSWORD: vaultx_password
      POSTGRES_DB: vaultx_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultx_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
